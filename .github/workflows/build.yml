name: TWRP Custom Recovery Builder (YT-X705X)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up Environment and Install Dependencies
        run: |
          sudo apt update
          sudo apt install -y git build-essential ccache python3 python3-pip openjdk-8-jdk android-tools-adb libncurses5
          
          pip3 install twrpdtgen
          
          sudo update-alternatives --set java /usr/lib/jvm/java-8-openjdk-amd64/jre/bin/java

      - name: Sync TWRP Source Code
        run: |
          mkdir twrp_source
          cd twrp_source
          
          repo init -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_omni.git -b twrp-9.0
          
          echo "Starting repo sync. This will take a while..."
          repo sync -j$(nproc --all)

      - name: Execute Device Tree Generator
        run: |
          twrpdtgen -i -p ../boot.img YT_X705X
          
          cp -r device/lenovo/YT-X705X twrp_source/device/lenovo/

      - name: Compile TWRP Recovery Image
        run: |
          cd twrp_source
          export ALLOW_MISSING_DEPENDENCIES=true
          
          source build/envsetup.sh
          
          lunch omni_YT_X705X-eng
          
          mka recoveryimage -j$(nproc --all)

      - name: Upload Recovery Image Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TWRP-YT-X705X-recovery
          path: twrp_source/out/target/product/YT_X705X/recovery.img
