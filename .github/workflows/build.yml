name: TWRP Custom Recovery Builder (YT-X705X)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04 # CHANGED: Switched to 22.04 LTS to skip the queue

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up Environment and Install Dependencies
        run: |
          # Install core dependencies
          sudo apt update
          sudo apt install -y git build-essential ccache python3 python3-pip openjdk-8-jdk android-tools-adb libncurses-dev
          
          # Install the Device Tree Generator
          pip3 install twrpdtgen
          
          # Set Java 8 as default (required for AOSP compilation)
          sudo update-alternatives --set java /usr/lib/jvm/java-8-openjdk-amd64/jre/bin/java

      - name: Install Repo Tool and Sync TWRP Source Code (FIXED PATH)
        run: |
          # 1. Install the REPO tool and set path for this shell session
          mkdir -p ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          export PATH=~/bin:$PATH

          # 2. Start the sync process in a new directory
          mkdir twrp_source
          cd twrp_source
          
          repo init -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_omni.git -b twrp-9.0
          
          echo "Starting repo sync. This will take several hours..."
          repo sync -j$(nproc --all)

      - name: Execute Device Tree Generator
        run: |
          # We need to explicitly run twrpdtgen with Python 3 here
          python3 -m twrpdtgen -i -p ../boot.img YT_X705X
          
          # Move the generated files into the source directory
          cp -r device/lenovo/YT-X705X twrp_source/device/lenovo/

      - name: Compile TWRP Recovery Image
        run: |
          cd twrp_source
          export ALLOW_MISSING_DEPENDENCIES=true
          
          source build/envsetup.sh
          
          lunch omni_YT_X705X-eng
          
          mka recoveryimage -j$(nproc --all)

      - name: Upload Recovery Image Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TWRP-YT-X705X-recovery
          path: twrp_source/out/target/product/YT_X705X/recovery.img

      - name: Cleanup Source Code
        if: always()
        run: |
          echo "Cleaning up large twrp_source directory..."
          rm -rf twrp_source
